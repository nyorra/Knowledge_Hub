version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: knowledge_hub_backend
    ports:
      - "8000:8000"
    environment:
      - CLIENT_URL=http://localhost:3000
      - SERVER_URL=http://localhost:8000
      - STORAGE_PATH=/app/storage
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./storage:/app/storage
      - ./server/chroma_db:/app/chroma_db
      - ./server/logs:/app/logs
    restart: unless-stopped
    networks:
      - knowledge_hub_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: knowledge_hub_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - knowledge_hub_network

networks:
  knowledge_hub_network:
    driver: bridge

volumes:
  storage:
  chroma_db:
  logs: