[project]
name = "server"
version = "0.1.0"
description = "backend service for Knowledge hub"
requires-python = ">=3.13"
dependencies = [
    "chardet>=7.4.3",
    "chromadb>=1.5.8",
    "fastapi>=0.136.1",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.2",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "langdetect>=1.0.9",
    "pdfplumber>=0.11.9",
    "pydantic-settings>=2.14.0",
    "pypdf>=6.10.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.26",
    "sentence-transformers>=5.4.1",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
